groups:
  - name: system-alerts

    rules:

      - alert: HighCPUUsage
        expr: |
          100 - (
            avg by(instance)(
              rate(node_cpu_seconds_total{mode="idle"}[5m])
            ) * 100
          ) > 90

        for: 5m

        labels:
          severity: warning

        annotations:
          summary: "High CPU usage detected"
          description: "CPU usage is above 90% for more than 5 minutes"

      - alert: TestAlert
        expr: vector(1)
        for: 10s
        labels:
          severity: test
        annotations:
          summary: "This is a test alert"
          description: "Testing Prometheus to Alertmanager communication"
